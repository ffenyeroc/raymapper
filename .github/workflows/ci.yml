name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + mesh coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Python tests (no database needed)
        run: python -m unittest -q test_api test_adb
      - name: Per-state hex coverage (geometry only)
        run: python scripts/check_state_coverage.py --no-api
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: UI geometry tests
        run: node --test ui/test_geo.js ui/test_search.js ui/test_downloads.js

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not just the pushed range
      # Not gitleaks-action: on a branch's first push it computes `root^..HEAD`,
      # which is not a valid revision, so the first commit of any new branch fails.
      - name: Scan every commit
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -O gitleaks > /tmp/gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --no-banner --redact --verbose

  collector:
    name: Collector unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
        working-directory: collector
      - name: Tests
        run: python -m unittest -q test_collector
        working-directory: collector

  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # a transitive CVE must be visible, not block merges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit both requirement sets
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r collector/requirements.txt
