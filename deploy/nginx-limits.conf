# Per-IP ingress limit for POST /ingest (installed to /etc/nginx/conf.d/).
#
# Each collector posts ~4 times an hour, so 30 requests/minute with a burst of 20
# leaves enormous headroom for shared/NATed addresses while capping a flood from a
# single source. This is a mitigation, not authorisation: proof of work and the
# per-device quota still run in the app.
limit_req_zone $binary_remote_addr zone=ingest:10m rate=30r/m;
