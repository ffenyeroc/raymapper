# /etc/nginx/sites-available/raymap
#
# Port 80 only: run certbot once DNS points here and it rewrites this block to
# add 443 plus the redirect to HTTPS.
#   certbot --nginx -d raymap.org -d api.raymap.org
server {
    listen 80;
    listen [::]:80;
    server_name raymap.org api.raymap.org;

    # Ingest bodies are capped at 1 MiB gzipped (RAYMAP_MAX_BODY_BYTES).
    client_max_body_size 2m;

    # No access log: a contributor's IP address is the one piece of metadata the
    # map deliberately does not keep, so the edge must not record it either.
    access_log off;

    # Inherited by any location that does not add headers of its own.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ingest needs its own location for the per-IP limit: proof of work is ~12 bits,
    # which is cheap to flood, and per-device quotas do not bind when a device id is
    # free to invent. The zone itself lives in conf.d/raymap-limits.conf.
    location = /ingest {
        limit_req zone=ingest burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: never trust a client
        # supplied X-Forwarded-For chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
