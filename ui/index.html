<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>raymap — crowdsourced detection map</title>
  <link href="style.css" rel="stylesheet" />
  <!-- Vendored locally (no CDN dependency): maplibre-gl 3.6.2, h3-js 4.5.0 -->
  <link href="vendor_maplibre-gl.css" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <h1>raymap</h1>
    <details class="menu" id="menu">
      <summary aria-label="Site menu">Menu</summary>
      <nav>
        <a href="/about">About</a>
        <a href="/downloads">Downloads</a>
      </nav>
    </details>
    <div class="controls">
      <form id="search-form" class="search" role="search">
        <input id="search" type="search" placeholder="ZIP or City"
               autocomplete="off" aria-label="Search by ZIP code or city" />
      </form>
      <label>
        Days
        <select id="days">
          <option value="1">1 day</option>
          <option value="7" selected>7 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="detections-only" />
        Detections only
      </label>
      <button id="refresh">Refresh</button>
      <span id="res-badge" class="badge">hex ≈ –</span>
      <span id="status" class="status"></span>
    </div>
  </header>

  <div id="map"></div>

  <div id="legend" class="legend">
    <div><span class="swatch solid red"></span> detection, 2+ devices</div>
    <div><span class="swatch hollow red"></span> detection, 1 device <em>(unconfirmed)</em></div>
    <div><span class="swatch solid green"></span> no detection, 2+ devices</div>
    <div><span class="swatch hollow green"></span> no detection, 1 device</div>
    <div><span class="swatch solid grey"></span> no reports</div>
    <div class="note">
      Grey means nobody reported from that cell — <strong>not</strong> evidence of safety.
      Hex size follows zoom (r3 ≈ 138 km → r6 ≈ 7.4 km, the finest cell shown).
    </div>
  </div>

  <script src="vendor_maplibre-gl.js"></script>
  <script src="vendor_h3-js.js"></script>
  <script src="geo.js"></script>
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
