# newsyslog rotation for the raymap service logs.
# Install with:  sudo cp launchd/raymap.newsyslog.conf /etc/newsyslog.d/raymap.conf
#
# logfilename                                  mode  count  size(KB)  when  flags
/Users/admin/Library/Logs/raymap-api.log       644   7      10240     *     J
/Users/admin/Library/Logs/raymap-backup.log    644   7      1024      *     J
